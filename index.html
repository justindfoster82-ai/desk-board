async function dec(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(B.salt),iterations:B.it,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(B.iv)},k,u(B.ct))))}
function boot(d){const S=d.state,of=window.fetch.bind(window);
 const prods=()=>{const s=new Set(['BTC-USD','ETH-USD',...Object.keys(S.ticks||{}),...Object.keys(S.candles||{})]);
  (S.watch&&S.watch.names||[]).forEach(n=>{if(n!=='—')s.add(n+'-USD')});(S.open||[]).forEach(t=>s.add(t.product));return[...s]};
 const tk=async p=>{try{const v=+(await (await of(`${PUB}/products/${p}/ticker`,{cache:'no-store'})).json()).price;return v||undefined}catch(e){}};
 const cdl=async p=>{try{const st=new Date(Date.now()-36e6).toISOString();const r=await (await of(`${PUB}/products/${p}/candles?granularity=900&start=${st}`,{cache:'no-store'})).json();
  if(Array.isArray(r)&&r.length)S.candles[p]=r.map(x=>[x[0],x[3],x[2],x[1],x[4]]).sort((a,b)=>a[0]-b[0]).slice(-40)}catch(e){}};
 const tickAll=async()=>{const t={};await Promise.all(prods().map(async p=>{const v=await tk(p);if(v){t[p]=v;S.ticks[p]=v}}));(S.open||[]).forEach(o=>{if(S.ticks[o.product])o.mark=S.ticks[o.product]});return t};
 window.fetch=async(url,o)=>{url=String(url);
  if(url.startsWith('/api/tick')){return new Response(JSON.stringify(await tickAll()))}
  if(url.startsWith('/api/state')){const age=Math.round((Date.now()-Date.parse(S.snap_as_of_iso||S.snap_as_of))/60000);if(!isNaN(age)){S.age_min=age;S.stale=age>120}
   S.candles=S.candles||{};S.ticks=S.ticks||{};await Promise.all([tickAll(),...Object.keys(S.candles).concat((S.watch&&S.watch.names||[]).filter(n=>n!=='—').map(n=>n+'-USD')).map(cdl)]);
   if(S.gate)for(const k in S.gate){const v=S.ticks[k+'-USD'];if(v){S.gate[k].price=v;if(S.gate[k].level)S.gate[k].ok=v>=S.gate[k].level}}
   S.now=new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago'})+' CT';return new Response(JSON.stringify(S))}
  return of(url,o)};

const saved=sessionStorage.getItem('cdpw');
async function go(pw){try{const d=await dec(pw);sessionStorage.setItem('cdpw',pw);boot(d)}catch(e){document.getElementById('e').textContent='Wrong password';sessionStorage.removeItem('cdpw')}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();go(document.getElementById('p').value)};if(saved)go(saved);
